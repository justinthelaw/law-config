---
minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Large Files Check
        args: ["--maxkb=1024"]
        # Exact immutable archives are verified by public-archive-integrity.
        exclude: |
          (?x)^docs/evaluations/(?:
            treatments/(?:
              fdc34c55ece9|6f23f7f98c26|a4465fb13180|a826a2341b6c|5b59b578a1bc
            )/package[.]patch
            |runs/pr-quality-panel-v2/baseline-53a8bd549c93/submissions[.]jsonl
            |runs/pr-quality-pytest-entry-natural-v1/lean-c-standalone-historical20-01-9726b39f2227/submissions[.]jsonl
          )$
        stages: [pre-push]

      - id: check-ast
        name: Python AST Check
        stages: [pre-commit, pre-push]

      - id: detect-private-key
        name: Private Key Check
        stages: [pre-push]

      - id: check-merge-conflict
        name: Merge Conflict Resolution Check
        stages: [pre-commit, pre-push]

      - id: end-of-file-fixer
        name: Newline EOF Checker
        stages: [pre-commit, pre-push]

      - id: trailing-whitespace
        # Unified diff context lines and indentation are patch data.
        exclude: '^docs/evaluations/(?:runs|treatments)/.*[.]patch$'
        name: Whitespace Cleaning Check
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/sirosen/texthooks
    rev: 1.0.0
    hooks:
      - id: fix-smartquotes
        # Preserve patch syntax and frozen machine evidence byte for byte.
        exclude: "^docs/evaluations/(?:(?:runs|treatments)/.*\\.(?:patch|json|jsonl)|develop-benchmark/panel/upstream\\.json)$"
        name: Fix Quotes
        stages: [pre-commit, pre-push]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: Markdown Lint
        args: ["--fix", "--config=.markdownlint-cli2.jsonc"]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: YAML Lint
        args: ["--strict", "-c=.yamllint"]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: GitHub Workflow Lint
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit, pre-push]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: Shell Script Format
        files: ^scripts/
        types: [shell]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        name: Shell Script Lint
        files: ^scripts/
        types: [shell]
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: public-archive-integrity
        name: Public Archive Integrity
        language: python
        entry: python docs/evaluations/tools/check_public_archives.py
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: shell-script-syntax
        name: Shell Script Syntax Check
        language: system
        entry: bash -c 'for file; do bash -n "$file" || exit $?; done' --
        files: ^scripts/sanitize-shell-hist$
        stages: [pre-commit, pre-push]

      - id: python-unit-tests
        name: Python Unit Tests
        language: python
        entry: python -m unittest discover -s tests -v
        pass_filenames: false
        stages: [pre-push]
