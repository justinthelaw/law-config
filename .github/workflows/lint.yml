---
name: Lint

permissions:
  contents: read

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Update npm
        run: npm install --global npm@12.0.2

      - name: Install Pre-Commit
        run: python -m pip install pre-commit==4.6.1

      - name: Check Zsh Configuration Syntax
        run: zsh -n configs/.zshrc configs/zsh/*.zsh

      - name: Run Pre-Commit Stage
        run: pre-commit run --all-files --hook-stage pre-commit

      - name: Run Pre-Push Stage
        run: pre-commit run --all-files --hook-stage pre-push
