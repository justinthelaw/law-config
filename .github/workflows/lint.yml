---
name: Lint

permissions:
  contents: read

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # Upgrade deferred: Node 26 is Current; retain 24 LTS until its October 28 LTS transition.
          # https://github.com/nodejs/Release/blob/main/schedule.json
          node-version: "24"

      # Exact security patch; next-12 is 12.2.1 while latest remains 12.2.0.
      - name: Update npm
        run: npm install --global npm@12.2.1

      - name: Install Pre-Commit
        run: python -m pip install pre-commit==4.7.0

      - name: Check Zsh Configuration Syntax
        run: |
          for file in configs/.zshrc configs/zsh/*.zsh; do
            zsh -n "$file" || exit $?
          done

      - name: Run Pre-Commit Stage
        run: pre-commit run --all-files --hook-stage pre-commit

      - name: Run Pre-Push Stage
        run: pre-commit run --all-files --hook-stage pre-push
